<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Ping Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-left: 1px solid #21262d;
      border-right: 1px solid #21262d;
      background: #161b22;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    .badge {
      font-size: 12px;
      color: #7ee787;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: #238636;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .assistant {
      align-self: flex-start;
      background: #21262d;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
    }
    .status {
      align-self: flex-start;
      font-size: 12px;
      color: #8b949e;
      font-style: italic;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #21262d;
      background: #0d1117;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #58a6ff; }
    button {
      padding: 0 18px;
      border-radius: 8px;
      border: none;
      background: #238636;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Spring Boot MCP Ping Agent</h1>
      <span class="badge">Groq + localhost:8080</span>
    </header>

    <div id="messages">
      <div class="msg assistant">Ready. Ask me to ping your server (e.g., "Ping my server as punge-bot") or ask what tools I have.</div>
    </div>

    <form id="chatForm">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" required />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const sendBtn = document.getElementById("sendBtn");

    function addBubble(text, className) {
      const div = document.createElement("div");
      div.className = `msg ${className}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      const thinking = document.createElement("div");
      thinking.className = "status";
      thinking.textContent = "Thinking & checking tools...";
      messages.appendChild(thinking);
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        thinking.remove();

        if (!res.ok) {
          addBubble(`Error: ${data.error}`, "assistant");
        } else {
          addBubble(data.reply, "assistant");
        }
      } catch (err) {
        thinking.remove();
        addBubble(`Network error: ${err.message}`, "assistant");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
